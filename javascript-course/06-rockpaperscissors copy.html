<!DOCTYPE html>

<html>

<head>
  <title>Rock paper scissors</title>
  <style>

  </style>
</head>

<body>

  <p>Rock paper scissors</p>
  <button onclick="
    getMove('Rock');
  ">Rock</button>
  <button onclick="
    getMove('Paper');
  ">Paper</button>
  <button onclick="
    getMove('Scissors');
  ">Scissors</button>

  <script>
    function getMove(move) {
      const randNumber = Math.random();
      let computerMove = '';
      let result = '';

      if (randNumber >= 0 && randNumber < 1 / 3) {
        computerMove = 'Rock';
      } else if (randNumber >= 1 / 3 && randNumber < 2 / 3) {
        computerMove = 'Paper';
      } else {
        computerMove = 'Scissors';
      }

      if (move === computerMove) {
          result = 'Tie game!';
      } else if ((move === 'Rock' && computerMove === 'Scissors') || (move === 'Scissors' && computerMove === 'Paper') || (move === 'Paper' && computerMove === 'Rock')) {
        result = 'You win!';
      } else{
        result = 'You lose!';
      }
      alert(result + ' | Player move: ' + move + " | Computer move: " + computerMove);
    }


  </script>
</body>

</html>
