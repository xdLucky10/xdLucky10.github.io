<!DOCTYPE html>

<html>

<head>
  <title>Rock paper scissors</title>
  <style>

  </style>
</head>

<body>

  <p>Rock paper scissors</p>
  <button onclick="
    getMove('Rock');
  ">Rock</button>
  <button onclick="
    getMove('Paper');
  ">Paper</button>
  <button onclick="
    getMove('Scissors');
  ">Scissors</button>
  <button onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    localStorage.removeItem('score');
  ">Reset score</button>

  <script>

    let score = JSON.parse(localStorage.getItem('score')) || {
      wins: 0,
      losses: 0,
      ties: 0
    };

    function getMove(move) {
      const randNumber = Math.random();
      let computerMove = '';
      let result = '';

      if (randNumber >= 0 && randNumber < 1 / 3) {
        computerMove = 'Rock';
      } else if (randNumber >= 1 / 3 && randNumber < 2 / 3) {
        computerMove = 'Paper';
      } else {
        computerMove = 'Scissors';
      }

      if (move === computerMove) {
        result = 'Tie game!';
        score.ties++;
      } else if ((move === 'Rock' && computerMove === 'Scissors') || (move === 'Scissors' && computerMove === 'Paper') || (move === 'Paper' && computerMove === 'Rock')) {
        result = 'You win!';
        score.wins++;
      } else {
        result = 'You lose!';
        score.losses++;
      }

      localStorage.setItem('score', JSON.stringify(score));

      alert(result + ' | Player move: ' + move + " | Computer move: " + computerMove + `\nWins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
    }


  </script>
</body>

</html>
