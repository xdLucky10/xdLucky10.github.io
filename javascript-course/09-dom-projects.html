<!DOCTYPE html>

<html>

<head>
  <title>DOM</title>
  <style>

  </style>
</head>

<body>

  <p>Youtube Subscribe Button</p>
  <button onclick="
    subscribe();
    " class="subscribeButton">Subscribe</button>

  <p>Amazon Shipping Calculator</p>
  <p>Orders under $40 = +$10 shipping.</p>
  <p>Orders over $40 = FREE shipping.</p>
  <input placeholder="Cost of order" class="type-bar" onkeydown="
    if(event.key === 'Enter'){
      calculateOrder();
    }
  ">
  <button class="calculate-button" onclick="
  calculateOrder();
  ">Calculate</button>
  <p class="final-price"></p>

  <script>
    function subscribe() {
      const buttonElement = document.querySelector('.subscribeButton');

      if (buttonElement.innerText === 'Subscribe') {
        buttonElement.innerHTML = 'Subscribed';
      } else {
        buttonElement.innerHTML = 'Subscribe';
      }
    }

    function calculateOrder() {
      const inputElement = document.querySelector('.type-bar');
      let price = Number(inputElement.value);
      let newPrice = 0;
      if (price < 40 && price != null) {
        newPrice = ((price * 100 + 1000) / 100);
      } else {
        newPrice = price;
      }

      document.querySelector('.final-price').innerHTML = `$${newPrice}`;
    }
  </script>
</body>

</html>
