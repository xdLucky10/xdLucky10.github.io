<!DOCTYPE html>

<html>

<head>
  <title>DOM</title>
  <style>
    body{
      font-family: Arial;
    }

    .subscribeButton{
      border:none;
      background-color: black;
      color:white;
      border-radius: 20px;
      padding-top: 8px;
      padding-bottom: 8px;
      padding-left:12px;
      padding-right:12px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 30px;
    }

    .is-subscribed{
      background-color: rgb(240, 240, 240);
      color:black;
    }

    .cost-input{
      font-size: 15px;
      padding: 10px;
    }

    .css-calculate-button{
      color: white;
      padding: 12px 15px;
      font-size: 15px;
      border:none;
      background-color: green;
      cursor: pointer;
    }

  </style>
</head>

<body>

  <p>Youtube Subscribe Button</p>
  <button onclick="
    subscribe();
    " class="js-subscribeButton subscribeButton">Subscribe</button>

  <p>Amazon Shipping Calculator</p>
  <p>Orders under $40 = +$10 shipping.</p>
  <p>Orders over $40 = FREE shipping.</p>
  <input placeholder="Cost of order" class="type-bar cost-input" onkeydown="
    if(event.key === 'Enter'){
      calculateOrder();
    }
  ">
  <button class="calculate-button css-calculate-button" onclick="
  calculateOrder();
  ">Calculate</button>
  <p class="final-price"></p>

  <a href="010-rockpaperscissors.html">Rock paper scissors</a>
  <a href="calculator.html">Calculator</a>

  <script>
    function subscribe() {
      const buttonElement = document.querySelector('.js-subscribeButton');

      if (buttonElement.innerText === 'Subscribe') {
        buttonElement.innerHTML = 'Subscribed';
        buttonElement.classList.add('is-subscribed');
      } else {
        buttonElement.innerHTML = 'Subscribe';
        buttonElement.classList.remove('is-subscribed');
      }
    }

    function calculateOrder() {
      const inputElement = document.querySelector('.type-bar');
      let price = Number(inputElement.value);
      let newPrice = 0;
      if (price < 40 && price != null) {
        newPrice = ((price * 100 + 1000) / 100);
      } else {
        newPrice = price;
      }

      document.querySelector('.final-price').innerHTML = `$${newPrice}`;
    }
  </script>
</body>

</html>
